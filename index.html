<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PL-PHYSICS ADVANCED STUDY PORTAL</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #030710;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
    }

    /* Background Canvas */
    #physics-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Top Portal Bar */
    .top-bar {
      width: 100%;
      text-align: center;
      padding: 10px;
      font-size: 0.85rem;
      letter-spacing: 2px;
      font-weight: 700;
      text-transform: uppercase;
      color: #00d2ff;
      background: rgba(0, 0, 0, 0.6);
      border-bottom: 1px solid rgba(0, 210, 255, 0.2);
      z-index: 2;
    }

    /* Main Wrapper */
    .main-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 550px;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Main Header */
    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Navigation Container */
    .container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Glowing Card Design */
    .card {
      background: rgba(8, 16, 32, 0.88);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(0, 210, 255, 0.4);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(0, 210, 255, 0.1);
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #00ffcc;
      box-shadow: 0 6px 25px rgba(0, 255, 204, 0.4), inset 0 0 20px rgba(0, 255, 204, 0.2);
    }

    .card a {
      color: #ffffff;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: block;
      transition: color 0.3s ease;
    }

    .card:hover a {
      color: #00ffcc;
    }

    /* Footer */
    .footer {
      position: relative;
      z-index: 2;
      margin-top: auto;
      padding: 15px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
    }
  </style>
</head>
<body>

  <canvas id="physics-canvas"></canvas>

  <div class="top-bar">PL-PHYSICS ADVANCED STUDY PORTAL</div>

  <div class="main-wrapper">
    <div class="header">
      <h1>⚛️ WELCOME TO PL-PHYSICS 💡</h1>
    </div>

    <div class="container">
      <div class="card">
        <a href="./centum2027.html">CENTUM IN PHYSICS-Materials</a>
      </div>
      <div class="card">
        <a href="./centum2027.html">DRIVE MATERIALS SHARE</a>
      </div>
      <div class="card">
        <a href="./MCQ.html">MCQ test series</a>
      </div>
      <div class="card">
        <a href="./figures.html">Diagram based test series</a>
      </div>
      <div class="card">
        <a href="./neet.html">NEET Exam- Practice test</a>
      </div>
      <div class="card">
        <a href="./Jee.html">JEE Mains test series</a>
      </div>
    </div>
  </div>

  <div class="footer">
    © PL-Physics 2027 | Powered by Curiosity
  </div>

  <script>
    const canvas = document.getElementById('physics-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 20 Formulae from 11th Standard
    const formulas11 = [
      "v = u + at", "s = ut + ½at²", "v² = u² + 2as", "F = ma", "p = mv",
      "W = ΔK", "K = ½mv²", "U = mgh", "P = W/t", "τ = r × F",
      "L = Iω", "F = G(m₁m₂)/r²", "T = 2π√(l/g)", "F = -kx", "ρ = m/V",
      "P = F/A", "PV = nRT", "v = fλ", "Cp - Cv = R", "ΔQ = ΔU + W"
    ];

    // 20 Formulae from 12th Standard
    const formulas12 = [
      "F = k(q₁q₂)/r²", "E = F/q", "V = IR", "P = VI", "P = V²/R",
      "F = q(E + v×B)", "B = μ₀I / (2πr)", "ε = -dΦ/dt", "c = 1/√(μ₀ε₀)", "E = hf",
      "λ = h/p", "E = mc²", "N = N₀e⁻λᵗ", "1/f = 1/v + 1/u", "d sinθ = mλ",
      "eV_stop = hf - Φ", "I = nAev_d", "XC = 1/(ωC)", "XL = ωL", "∇×E = -∂B/∂t"
    ];

    const neonColors = [
      "#00d2ff", "#00ffcc", "#ff007f", "#ffdd00",
      "#a855f7", "#3b82f6", "#10b981", "#f97316"
    ];

    function getRandomColor() {
      return neonColors[Math.floor(Math.random() * neonColors.length)];
    }

    // Combined list of 40 formulas
    const allFormulas = [...formulas11, ...formulas12];

    // Exactly 8 Radial Lines: 4 on Right, 4 on Left (No Vertical Top/Bottom)
    const degToRad = d => (d * Math.PI) / 180;
    const radialAngles = [
      degToRad(-50), degToRad(-20), degToRad(20), degToRad(50),   // 4 Right Side
      degToRad(130), degToRad(160), degToRad(-160), degToRad(-130) // 4 Left Side
    ];

    class RadialQueueManager {
      constructor(angle, formulaList) {
        this.angle = angle;
        this.formulaList = formulaList;
        this.index = 0;
        this.items = [];
        this.speed = 1.2; // Pixels per frame inward
        this.spacing = 180; // Minimum distance (pixels) between formulas in queue
      }

      updateAndDraw(centerX, centerY, maxRadius, minRadius) {
        // Spawn first item or next queue item when space is available
        if (this.items.length === 0 || (maxRadius - this.items[this.items.length - 1].radius >= this.spacing)) {
          const formulaText = this.formulaList[this.index % this.formulaList.length];
          this.index++;
          this.items.push({
            text: formulaText,
            radius: maxRadius,
            color: getRandomColor()
          });
        }

        // Move and draw each item in queue
        for (let i = this.items.length - 1; i >= 0; i--) {
          let item = this.items[i];
          item.radius -= this.speed;

          // Remove item once it reaches the center cards boundary
          if (item.radius <= minRadius) {
            this.items.splice(i, 1);
            continue;
          }

          // Convert polar distance to screen coordinates
          const x = centerX + item.radius * Math.cos(this.angle);
          const y = centerY + item.radius * Math.sin(this.angle);

          ctx.save();
          ctx.translate(x, y);

          // Rotate text naturally along ray angle
          let rotationAngle = this.angle;
          if (this.angle > Math.PI / 2 || this.angle < -Math.PI / 2) {
            rotationAngle += Math.PI; // Keeps left side text right-side up
          }
          ctx.rotate(rotationAngle);

          // Render Larger Font (20px bold)
          ctx.font = `700 20px 'Courier New', monospace`;
          ctx.fillStyle = item.color;
          ctx.shadowColor = item.color;
          ctx.shadowBlur = 10;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          ctx.fillText(item.text, 0, 0);
          ctx.restore();
        }
      }
    }

    // Divide formulas evenly across the 8 ray queues
    const queues = [];
    const formulasPerRay = Math.ceil(allFormulas.length / radialAngles.length);

    radialAngles.forEach((angle, rayIndex) => {
      const slice = allFormulas.slice(rayIndex * formulasPerRay, (rayIndex + 1) * formulasPerRay);
      queues.push(new RadialQueueManager(angle, slice.length > 0 ? slice : allFormulas));
    });

    // Draw the 8 ray guidelines
    function drawStarRays(centerX, centerY, maxRadius) {
      ctx.strokeStyle = "rgba(0, 210, 255, 0.12)";
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 6]);

      radialAngles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(
          centerX + maxRadius * Math.cos(angle),
          centerY + maxRadius * Math.sin(angle)
        );
        ctx.stroke();
      });

      ctx.setLineDash([]);
    }

    // Animation Loop
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const maxRadius = Math.sqrt(centerX * centerX + centerY * centerY);
      const minRadius = 220; // Radius where cards sit

      drawStarRays(centerX, centerY, maxRadius);

      // Process strictly controlled queues for each ray
      queues.forEach(q => q.updateAndDraw(centerX, centerY, maxRadius, minRadius));

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PL-PHYSICS ADVANCED STUDY PORTAL</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #030710;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
    }

    /* Background Canvas */
    #physics-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Top Portal Bar */
    .top-bar {
      width: 100%;
      text-align: center;
      padding: 10px;
      font-size: 0.85rem;
      letter-spacing: 2px;
      font-weight: 700;
      text-transform: uppercase;
      color: #00d2ff;
      background: rgba(0, 0, 0, 0.6);
      border-bottom: 1px solid rgba(0, 210, 255, 0.2);
      z-index: 2;
    }

    /* Main Wrapper */
    .main-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 550px;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Main Header */
    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Navigation Container */
    .container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Glowing Card Design */
    .card {
      background: rgba(8, 16, 32, 0.85);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(0, 210, 255, 0.4);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(0, 210, 255, 0.1);
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #00ffcc;
      box-shadow: 0 6px 25px rgba(0, 255, 204, 0.4), inset 0 0 20px rgba(0, 255, 204, 0.2);
    }

    .card a {
      color: #ffffff;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: block;
      transition: color 0.3s ease;
    }

    .card:hover a {
      color: #00ffcc;
    }

    /* Footer */
    .footer {
      position: relative;
      z-index: 2;
      margin-top: auto;
      padding: 15px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
    }
  </style>
</head>
<body>

  <canvas id="physics-canvas"></canvas>

  <div class="top-bar">PL-PHYSICS ADVANCED STUDY PORTAL</div>

  <div class="main-wrapper">
    <div class="header">
      <h1>⚛️ WELCOME TO PL-PHYSICS 💡</h1>
    </div>

    <div class="container">
      <div class="card">
        <a href="./centum2027.html">CENTUM IN PHYSICS-Materials</a>
      </div>
      <div class="card">
        <a href="./MCQ.html">MCQ test series</a>
      </div>
      <div class="card">
        <a href="./figures.html">Diagram based test series</a>
      </div>
      <div class="card">
        <a href="./neet.html">NEET Exam- Practice test</a>
      </div>
      <div class="card">
        <a href="./Jee.html">JEE Mains test series</a>
      </div>
    </div>
  </div>

  <div class="footer">
    © PL-Physics 2027 | Powered by Curiosity
  </div>

  <script>
    const canvas = document.getElementById('physics-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 20 Formulae from 11th Standard
    const formulas11 = [
      "v = u + at", "s = ut + ½ at²", "v² = u² + 2as", "F = ma", "p = mv",
      "W = ΔK", "K = ½mv²", "U = mgh", "P = W/t", "τ = r × F",
      "L = Iω", "F = G(m₁m₂)/r²", "T = 2π√(l/g)", "F = -kx", "ρ = m/V",
      "P = F/A", "PV = nRT", "v = fλ", "Cp - Cv = R", "ΔQ = ΔU + W"
    ];

    // 20 Formulae from 12th Standard
    const formulas12 = [
      "F = k(q₁q₂)/r²", "E = F/q", "V = IR", "P = VI", "P = V²/R",
      "F = q(E + v×B)", "B = μ₀I / (2πr)", "ε = -dΦ/dt", "c = 1/√(μ₀ε₀)", "E = hf",
      "λ = h/p", "E = mc²", "N = N₀e⁻λᵗ", "1/f = 1/v + 1/u", "d sinθ = mλ",
      "eV_stop = hf - Φ", "I = nAev_d", "XC = 1/(ωC)", "XL = ωL", "∇×E = -∂B/∂t"
    ];

    const neonColors = [
      "#00d2ff", "#00ffcc", "#ff007f", "#ffdd00",
      "#a855f7", "#3b82f6", "#10b981", "#f97316"
    ];

    function getRandomColor() {
      return neonColors[Math.floor(Math.random() * neonColors.length)];
    }

    // Combine formulas into single dataset
    const allFormulas = [];
    formulas11.forEach(f => allFormulas.push(f));
    formulas12.forEach(f => allFormulas.push(f));

    // Exactly 9 Radial Star Paths (evenly spaced 360 / 9 degrees = 40 deg intervals)
    const NUM_TRACKS = 9;
    const radialAngles = [];
    for (let i = 0; i < NUM_TRACKS; i++) {
      radialAngles.push((i * (2 * Math.PI / NUM_TRACKS)));
    }

    class RadialFormula {
      constructor(text, trackIndex, sequenceOffset) {
        this.text = text;
        this.trackIndex = trackIndex;
        // Negative offset creates a delayed, one-after-the-other queue per ray
        this.progress = -sequenceOffset; 
        this.speed = 0.0018 + Math.random() * 0.0004;
        this.color = getRandomColor();
        this.fontSize = 25;
      }

      update() {
        this.progress += this.speed;

        // Reset to outer boundary when formula reaches the central card menu
        if (this.progress >= 1.0) {
          this.progress = 0.0;
          this.color = getRandomColor();
        }

        // Only draw when visible on screen (progress >= 0)
        if (this.progress >= 0) {
          this.draw();
        }
      }

      draw() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        const maxRadius = Math.sqrt(centerX * centerX + centerY * centerY);
        const minRadius = 200; // Stopping zone around menu cards

        const currentRadius = maxRadius - (this.progress * (maxRadius - minRadius));
        const angle = radialAngles[this.trackIndex];

        // Polar coordinates
        const x = centerX + currentRadius * Math.cos(angle);
        const y = centerY + currentRadius * Math.sin(angle);

        ctx.save();
        ctx.translate(x, y);

        // Rotate text to match ray direction
        // Adjust left side text so it is never upside down
        let textRotation = angle;
        if (angle > Math.PI / 2 && angle < (3 * Math.PI) / 2) {
          textRotation += Math.PI; 
        }
        ctx.rotate(textRotation);

        ctx.font = `600 ${this.fontSize}px 'Courier New', monospace`;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(this.text, 0, 0);
        ctx.restore();
      }
    }

    // Build the 40-formula starburst stream
    const activeFormulas = [];
    allFormulas.forEach((formulaText, index) => {
      const trackIndex = index % NUM_TRACKS; // Distribute across 9 tracks
      // Create equal distance delays so formulas arrive one after another
      const sequenceOffset = Math.floor(index / NUM_TRACKS) * 0.22;
      activeFormulas.push(new RadialFormula(formulaText, trackIndex, sequenceOffset));
    });

    // Draw the 9 Star Ray Guide Lines
    function drawStarRays() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const maxRadius = Math.sqrt(centerX * centerX + centerY * centerY);

      ctx.strokeStyle = "rgba(0, 210, 255, 0.1)";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);

      radialAngles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(
          centerX + maxRadius * Math.cos(angle),
          centerY + maxRadius * Math.sin(angle)
        );
        ctx.stroke();
      });

      ctx.setLineDash([]);
    }

    // Animation Loop
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawStarRays();

      activeFormulas.forEach(f => f.update());

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>

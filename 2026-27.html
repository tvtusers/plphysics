<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XI Physics Study Materials</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Physics Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .accordion-content {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 120px;
            opacity: 1;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg space-y-4">
        
        <!-- XI-JEE Physics Card -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-shadow duration-200 overflow-hidden">
            <!-- Card Header / Toggle Button -->
            <button onclick="toggleCard('jee')" class="w-full p-6 flex items-center justify-between bg-white hover:bg-slate-50/80 transition-colors text-left focus:outline-none">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl shadow-inner">
                        <i class="fa-solid fa-atom"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-slate-800">XI-JEE Physics Materials</h2>
                        <p class="text-xs text-slate-400 mt-0.5">Click to view drive link</p>
                    </div>
                </div>
                <i id="jeeChevron" class="fa-solid fa-chevron-down text-slate-400 transition-transform duration-300"></i>
            </button>

            <!-- Expanded Drive Link Area -->
            <div id="jeeContent" class="accordion-content border-t border-slate-100 bg-slate-50/50">
                <div class="p-5 flex justify-center items-center">
                    <a href="https://drive.google.com/drive/folders/1yGdDjJUkQ4UhbFsUzkAlOpNNePPFE-gF?usp=sharing" 
                       target="_blank" 
                       rel="noopener noreferrer" 
                       class="inline-flex items-center justify-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-md hover:shadow-indigo-200 hover:-translate-y-0.5 w-full text-center">
                        <i class="fa-brands fa-google-drive"></i>
                        <span>CLICK TO OPEN THE DRIVE</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-70"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- XI-NEET Physics Card -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-shadow duration-200 overflow-hidden">
            <!-- Card Header / Toggle Button -->
            <button onclick="toggleCard('neet')" class="w-full p-6 flex items-center justify-between bg-white hover:bg-slate-50/80 transition-colors text-left focus:outline-none">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl shadow-inner">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-slate-800">XI-NEET Physics Materials</h2>
                        <p class="text-xs text-slate-400 mt-0.5">Click to view drive link</p>
                    </div>
                </div>
                <i id="neetChevron" class="fa-solid fa-chevron-down text-slate-400 transition-transform duration-300"></i>
            </button>

            <!-- Expanded Drive Link Area -->
            <div id="neetContent" class="accordion-content border-t border-slate-100 bg-slate-50/50">
                <div class="p-5 flex justify-center items-center">
                    <a href="https://drive.google.com/drive/folders/1plU9Q2GUx76SSppzwYEzsIJ9FwhBN8EE?usp=sharing" 
                       target="_blank" 
                       rel="noopener noreferrer" 
                       class="inline-flex items-center justify-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-md hover:shadow-emerald-200 hover:-translate-y-0.5 w-full text-center">
                        <i class="fa-brands fa-google-drive"></i>
                        <span>CLICK TO OPEN THE DRIVE</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-70"></i>
                    </a>
                </div>
            </div>
        </div>

    </div>

    <script>
        function toggleCard(type) {
            const content = document.getElementById(type + 'Content');
            const chevron = document.getElementById(type + 'Chevron');

            const isOpen = content.classList.contains('open');

            if (isOpen) {
                content.classList.remove('open');
                chevron.classList.remove('rotate-180');
            } else {
                content.classList.add('open');
                chevron.classList.add('rotate-180');
            }
        }
    </script>
</body>
</html>
